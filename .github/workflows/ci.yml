name: CI

# 已发布的 npm 包（z-biz-tool-shared@0.1.0）被 db/note/terminal 等仓直接依赖，改坏了会同时
# 让下游装到坏版本。原来没有任何门禁，push 到 main 什么都不会跑；这条只做便宜检查，不发布。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支新 push 取消旧 run，避免排队跑中间态。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 不建 release、不 npm publish，权限只读。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmmirror.com

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 刻意不加 `npm run lint`：本机实测 exit 2，报 "ESLint couldn't find a configuration
      # file"（仓库里没有 eslint 配置），它红不是因为代码有问题而是工具根本没配好。
      # 把它挂成门禁只会得到一条永久红灯；要恢复 lint 得先补配置文件，那是另一件事。
