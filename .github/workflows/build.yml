name: Build & Package

# 打 tag（v*）才出包：npm 包用 npm pack 产 tarball artifact。
# 不自动 publish 到 npm（发布仍走人工，避免需要 NPM_TOKEN secret）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: npm pack
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmmirror.com

      - name: Build
        run: npm run build

      - name: Pack
        run: |
          mkdir -p out
          npm pack --pack-destination out
          ls -la out
          test -n "$(ls -A out)" || { echo "npm pack 没有产出 tarball"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball-${{ github.ref_name }}
          path: out/*
          if-no-files-found: error
